name: Build Pulp packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build Windows
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item src-tauri/target/${{ matrix.target }}/release/pulp.exe release/Pulp-windows-x64.exe
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release/
      - name: Build macOS
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Collect macOS packages
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Pulp.app release/Pulp-${{ matrix.label }}.app.zip
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release/
      - uses: actions/upload-artifact@v4
        with:
          name: Pulp-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
