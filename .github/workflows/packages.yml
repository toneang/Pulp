name: Build Pulp packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Package metadata
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag and package version do not match" >&2
            exit 1
          fi
      - name: Build Windows
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PULP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force packages
          Copy-Item src-tauri/target/${{ matrix.target }}/release/pulp.exe "packages/Pulp-$env:PULP_VERSION-windows-x64.exe"
          Compress-Archive -Path "packages/Pulp-$env:PULP_VERSION-windows-x64.exe", release/下载说明.md -DestinationPath "packages/Pulp-$env:PULP_VERSION-windows-x64.zip"
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe packages/
      - name: Build macOS
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Collect macOS packages
        if: runner.os == 'macOS'
        env:
          PULP_VERSION: ${{ steps.meta.outputs.version }}
          PULP_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Pulp.app "packages/Pulp-$PULP_VERSION-$PULP_LABEL.app.zip"
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            cp "$dmg" "packages/Pulp-$PULP_VERSION-$PULP_LABEL.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Pulp-${{ matrix.label }}
          path: packages/*
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pulp-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Pulp-*
          path: packages
          merge-multiple: true
      - name: Prepare release files
        run: |
          cp release/下载说明.md packages/
          cd packages
          sha256sum ./*.exe ./*.zip ./*.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PULP_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$PULP_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$PULP_TAG" --repo "$GITHUB_REPOSITORY" --title "Pulp $PULP_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$PULP_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Pulp $PULP_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$PULP_TAG" --repo "$GITHUB_REPOSITORY" packages/* --clobber
