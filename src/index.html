<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulp</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="titlebar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>Pulp</span>
        <div class="actions">
          <button id="btn-pin" class="icon-btn" type="button" title="取消置顶" data-i18n-title="取消置顶" aria-label="窗口置顶" data-i18n-aria-label="窗口置顶" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2h6M6 2v5l-2 3h8l-2-3V2M8 10v4" /></svg>
          </button>
          <button id="btn-minimize" class="icon-btn" type="button" title="最小化" data-i18n-title="最小化" aria-label="最小化" data-i18n-aria-label="最小化">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 8.5h9" />
            </svg>
          </button>
          <button id="btn-maximize" class="icon-btn" type="button" title="最大化 / 还原" data-i18n-title="最大化 / 还原" aria-label="最大化" data-i18n-aria-label="最大化">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" />
            </svg>
          </button>
          <button id="btn-hide" class="icon-btn" type="button" title="隐藏 (Esc)" data-i18n-title="隐藏 (Esc)" aria-label="隐藏" data-i18n-aria-label="隐藏">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
          <button id="btn-quit" class="icon-btn danger" type="button" title="退出 Pulp" data-i18n-title="退出 Pulp" aria-label="退出" data-i18n-aria-label="退出">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 2.5v6" />
              <path d="M4.6 4.9a5 5 0 1 0 6.8 0" />
            </svg>
          </button>
        </div>
      </header>

      <nav class="toolbar">
        <div class="file-actions">
          <button id="btn-new" class="mode-btn" type="button" title="新建笔记（当前笔记自动归档）" data-i18n-title="新建笔记（当前笔记自动归档）" data-i18n="新建">新建</button>
          <button id="btn-history" class="mode-btn" type="button" data-i18n="历史">历史</button>
          <button id="font-smaller" class="mode-btn" type="button" aria-label="缩小字号" data-i18n-aria-label="缩小字号">A−</button>
          <button id="font-larger" class="mode-btn" type="button" aria-label="放大字号" data-i18n-aria-label="放大字号">A+</button>
          <button id="btn-export-md" class="mode-btn" type="button" data-i18n="导出 MD">导出 MD</button>
          <button id="btn-export-pdf" class="mode-btn" type="button" data-i18n="导出 PDF">导出 PDF</button>
        </div>
        <div class="mode-switch" role="group" aria-label="编辑格式" data-i18n-aria-label="编辑格式">
          <button id="mode-markdown" class="mode-btn" type="button" data-format="markdown">
            Markdown
          </button>
          <button id="mode-plain" class="mode-btn" type="button" data-format="plain" data-i18n="纯文本">
            纯文本
          </button>
        </div>
        <button id="btn-settings" class="icon-btn" type="button" title="设置 (Ctrl+,)" data-i18n-title="设置 (Ctrl+,)" aria-label="设置" data-i18n-aria-label="设置">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.1" />
            <path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5" />
          </svg>
        </button>
      </nav>

      <main class="canvas">
        <section id="history-panel" class="history-panel" hidden aria-label="历史笔记" data-i18n-aria-label="历史笔记">
          <div class="history-heading"><strong data-i18n="历史笔记">历史笔记</strong><button id="history-close" class="mode-btn" type="button" data-i18n="返回">返回</button></div>
          <p data-i18n="打开前会自动归档当前笔记。">打开前会自动归档当前笔记。</p>
          <div id="history-list"></div>
        </section>
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          placeholder="随手写点什么…" data-i18n-placeholder="随手写点什么…"
        ></textarea>
        <article id="preview" class="preview" hidden></article>

        <section id="settings" class="settings" hidden>
          <div class="setting-row">
            <label class="setting-label" for="language-select" data-i18n="界面语言">界面语言</label>
            <select id="language-select" class="setting-select">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <p class="setting-hint" data-i18n="语言切换立即生效，笔记正文不会被翻译。">语言切换立即生效，笔记正文不会被翻译。</p>
          <div class="setting-row">
            <label class="setting-label" for="shortcut-input" data-i18n="唤出快捷键">唤出快捷键</label>
            <input
              id="shortcut-input"
              class="shortcut-input"
              type="text"
              readonly
              spellcheck="false"
              placeholder="点击后按下组合键" data-i18n-placeholder="点击后按下组合键"
            />
          </div>
          <p class="setting-hint" id="shortcut-feedback" data-i18n="点击输入框后直接按组合键，需至少一个修饰键。">
            点击输入框后直接按组合键，需至少一个修饰键。
          </p>

          <div class="setting-row">
            <label class="setting-label" for="default-format" data-i18n="新笔记默认格式">新笔记默认格式</label>
            <select id="default-format" class="setting-select">
              <option value="markdown">Markdown</option>
              <option value="plain" data-i18n="纯文本">纯文本</option>
            </select>
          </div>

          <div class="setting-row">
            <label class="setting-label" for="autostart" data-i18n="开机自启">开机自启</label>
            <input id="autostart" class="setting-check" type="checkbox" />
          </div>
          <p class="setting-hint" id="autostart-feedback"></p>

          <div class="setting-row">
            <label class="setting-label" for="notes-directory" data-i18n="新笔记保存文件夹">新笔记保存文件夹</label>
            <button id="choose-notes-directory" class="mode-btn" type="button" data-i18n="选择文件夹…">选择文件夹…</button>
          </div>
          <input id="notes-directory" class="notes-directory" type="text" readonly aria-label="新笔记保存文件夹路径" data-i18n-aria-label="新笔记保存文件夹路径" />
          <p class="setting-hint" id="directory-feedback" role="status" data-i18n="仅对之后新建的笔记生效，Markdown 保存为 .md，纯文本保存为 .txt。">仅对之后新建的笔记生效，Markdown 保存为 .md，纯文本保存为 .txt。</p>

          <div class="setting-footer">
            <button id="btn-reset-shortcut" class="text-btn" type="button" data-i18n="恢复默认快捷键">
              恢复默认快捷键
            </button>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <button
          id="btn-toggle-view"
          class="view-toggle"
          type="button"
          title="切换源码 / 渲染 (Ctrl+E)" data-i18n-title="切换源码 / 渲染 (Ctrl+E)"
          aria-label="切换源码或渲染" data-i18n-aria-label="切换源码或渲染"
        >
          <svg class="view-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 4.2L2.6 8 6 11.8" />
            <path d="M10 4.2L13.4 8 10 11.8" />
          </svg>
          <span id="view-toggle-label" data-i18n="源码">源码</span>
        </button>
        <span id="status" class="status">—</span>
        <span id="counter" class="counter"></span>
      </footer>

    </div>

    <div id="table-picker" class="table-picker" hidden>
      <div class="table-picker-grid" id="table-grid"></div>
      <div class="table-picker-foot">
        <span id="table-picker-label" data-i18n="3 × 3 表格">3 × 3 表格</span>
        <span class="table-picker-hint" data-i18n="Esc 取消">Esc 取消</span>
      </div>
    </div>

    <div class="resize-grip" data-resize="North"></div>
    <div class="resize-grip" data-resize="South"></div>
    <div class="resize-grip" data-resize="West"></div>
    <div class="resize-grip" data-resize="East"></div>
    <div class="resize-grip" data-resize="NorthWest"></div>
    <div class="resize-grip" data-resize="NorthEast"></div>
    <div class="resize-grip" data-resize="SouthWest"></div>
    <div class="resize-grip" data-resize="SouthEast"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
