<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulp</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="titlebar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>Pulp</span>
        <div class="actions">
          <button id="btn-pin" class="icon-btn" type="button" title="取消置顶" aria-label="窗口置顶" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2h6M6 2v5l-2 3h8l-2-3V2M8 10v4" /></svg>
          </button>
          <button id="btn-minimize" class="icon-btn" type="button" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 8.5h9" />
            </svg>
          </button>
          <button id="btn-maximize" class="icon-btn" type="button" title="最大化 / 还原" aria-label="最大化">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" />
            </svg>
          </button>
          <button id="btn-hide" class="icon-btn" type="button" title="隐藏 (Esc)" aria-label="隐藏">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
          <button id="btn-quit" class="icon-btn danger" type="button" title="退出 Pulp" aria-label="退出">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 2.5v6" />
              <path d="M4.6 4.9a5 5 0 1 0 6.8 0" />
            </svg>
          </button>
        </div>
      </header>

      <nav class="toolbar">
        <div class="file-actions">
          <button id="btn-new" class="mode-btn" type="button" title="新建笔记（当前笔记自动归档）">新建</button>
          <button id="btn-export-md" class="mode-btn" type="button">导出 MD</button>
          <button id="btn-export-pdf" class="mode-btn" type="button">导出 PDF</button>
        </div>
        <div class="mode-switch" role="group" aria-label="编辑格式">
          <button id="mode-markdown" class="mode-btn" type="button" data-format="markdown">
            Markdown
          </button>
          <button id="mode-plain" class="mode-btn" type="button" data-format="plain">
            纯文本
          </button>
        </div>
        <button id="btn-settings" class="icon-btn" type="button" title="设置 (Ctrl+,)" aria-label="设置">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.1" />
            <path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5" />
          </svg>
        </button>
      </nav>

      <main class="canvas">
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          placeholder="随手写点什么…"
        ></textarea>
        <article id="preview" class="preview" hidden></article>

        <section id="settings" class="settings" hidden>
          <div class="setting-row">
            <label class="setting-label" for="shortcut-input">唤出快捷键</label>
            <input
              id="shortcut-input"
              class="shortcut-input"
              type="text"
              readonly
              spellcheck="false"
              placeholder="点击后按下组合键"
            />
          </div>
          <p class="setting-hint" id="shortcut-feedback">
            点击输入框后直接按组合键，需至少一个修饰键。
          </p>

          <div class="setting-row">
            <label class="setting-label" for="default-format">新笔记默认格式</label>
            <select id="default-format" class="setting-select">
              <option value="markdown">Markdown</option>
              <option value="plain">纯文本</option>
            </select>
          </div>

          <div class="setting-row">
            <label class="setting-label" for="autostart">开机自启</label>
            <input id="autostart" class="setting-check" type="checkbox" />
          </div>
          <p class="setting-hint" id="autostart-feedback"></p>

          <div class="setting-footer">
            <button id="btn-reset-shortcut" class="text-btn" type="button">
              恢复默认快捷键
            </button>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <button
          id="btn-toggle-view"
          class="view-toggle"
          type="button"
          title="切换源码 / 渲染 (Ctrl+E)"
          aria-label="切换源码或渲染"
        >
          <svg class="view-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 4.2L2.6 8 6 11.8" />
            <path d="M10 4.2L13.4 8 10 11.8" />
          </svg>
          <span id="view-toggle-label">源码</span>
        </button>
        <span id="status" class="status">—</span>
        <span id="counter" class="counter"></span>
      </footer>

    </div>

    <div id="table-picker" class="table-picker" hidden>
      <div class="table-picker-grid" id="table-grid"></div>
      <div class="table-picker-foot">
        <span id="table-picker-label">3 × 3 表格</span>
        <span class="table-picker-hint">Esc 取消</span>
      </div>
    </div>

    <div class="resize-grip" data-resize="North"></div>
    <div class="resize-grip" data-resize="South"></div>
    <div class="resize-grip" data-resize="West"></div>
    <div class="resize-grip" data-resize="East"></div>
    <div class="resize-grip" data-resize="NorthWest"></div>
    <div class="resize-grip" data-resize="NorthEast"></div>
    <div class="resize-grip" data-resize="SouthWest"></div>
    <div class="resize-grip" data-resize="SouthEast"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
